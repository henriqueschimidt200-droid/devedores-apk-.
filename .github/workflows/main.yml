name: Devedores 5.3 - APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "SDK Android 35 encontrado."

      - name: Configurar AndroidX
        run: |
          touch gradle.properties

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          echo "=== gradle.properties ==="
          cat gradle.properties

      - name: Criar local.properties
        run: |
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Verificar projeto
        run: |
          echo "=== RAIZ ==="
          ls -la

          echo "=== APP ==="
          ls -la app

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

      - name: Compilar APK
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Procurar APK
        if: always()
        run: |
          echo "=== APKs ==="
          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Devedores-5.3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Devedores-5.3-LOG
          path: |
            ~/.gradle/daemon/*/daemon-*.out.log
          if-no-files-found: ignore
          retention-days: 14
